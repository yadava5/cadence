name: CI

# Validates what actually ships for this codebase:
#   - readme-facts : every number the README asserts, checked against the code
#   - lint      : ESLint + Prettier over the app / api / server-handlers
#   - typecheck : tsc --noEmit over the frontend app (vite build does NOT typecheck)
#   - tests     : frontend + backend unit/integration suites
#   - build     : build:shared + build:frontend (mirrors the Vercel build command)
# The standalone booklet/ sub-project has its own toolchain and is excluded
# from the root lint/format scope.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The README's numbers drifted for months because nothing could notice. This
  # job is why they now can't: it recomputes every countable claim from source
  # and fails on a mismatch — or on a claim that has been reworded out of range
  # of its own check, which is the way the last set went stale unseen.
  # Deliberately dependency-free (node builtins only), so it is the fastest job
  # here and has no reason to be skipped or disabled.
  readme-facts:
    name: README facts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Check every number the README asserts
        run: node scripts/readme-facts.mjs --check

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Frontend app is the primary shipping artifact; `vite build` strips types
      # without checking them, so run an explicit no-emit typecheck here.
      # @shared/* resolves to packages/shared/src, so no build:shared is needed.
      - name: Typecheck frontend app
        run: npx tsc --noEmit -p tsconfig.app.json

      - name: Typecheck build config
        run: npx tsc --noEmit -p tsconfig.node.json

      # The serverless API — api/, lib/ and all 37 handlers in
      # server-handlers/. Nothing type-checked this tree before: the root
      # tsconfig referenced only the two projects above, and the api/tsconfig
      # that used to exist was run by nothing. The cost of that gap was
      # `GET /api/auth/me` answering 405 in production since the day it was
      # written, from an excess-property error this step now rejects. See the
      # header of tsconfig.api.json for the two deliberately relaxed flags.
      - name: Typecheck serverless API
        run: npx tsc --noEmit -p tsconfig.api.json

  test-frontend:
    name: Frontend Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build shared package
        run: npm run build:shared

      - name: Run frontend tests
        run: npm run test:frontend:run

  test-backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build shared package
        run: npm run build:shared

      - name: Run backend tests
        run: npm run test:backend:run -- --reporter=default --reporter=json --outputFile=${{ runner.temp }}/backend-results.json
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db
          # Superuser admin URL that unlocks the real-Postgres RLS enforcement
          # suite (lib/__tests__/rls.postgres.test.ts). It builds an isolated
          # schema + non-bypass role + policies and drives the production query
          # machinery to prove DB-level tenant isolation. Unset locally → the
          # suite skips.
          RLS_TEST_PG_ADMIN_URL: postgresql://postgres:postgres@localhost:5432/test_db

      # ── the suite must have RUN, not merely passed ──────────────────
      #
      # rls.postgres.test.ts skips itself when RLS_TEST_PG_ADMIN_URL is unset,
      # and a skipped suite is GREEN. So a typo in the env block above, a
      # renamed service, or a dropped variable would silently turn the only
      # proof of database-level tenant isolation into a no-op, and CI would
      # keep reporting success.
      #
      # Applied solves this in its own backend-ci.yml by parsing the JUnit XML
      # and failing when the RLS suite reports zero tests or any skip. This is
      # the same guard against the vitest JSON reporter. Added 2026-08-02 after
      # a cross-repo audit found the pattern in one repo and not the other.
      - name: Assert the Postgres enforcement suites actually ran
        if: always()
        run: |
          node - <<'JS'
          const fs = require('fs');
          const path = process.env.RUNNER_TEMP + '/backend-results.json';
          if (!fs.existsSync(path)) {
            console.error('No vitest report at ' + path);
            process.exit(1);
          }
          const report = JSON.parse(fs.readFileSync(path, 'utf8'));
          // Match the SUFFIX, not one file name. This guard used to key on the
          // literal 'rls.postgres.test.ts', so every Postgres suite added after
          // it — refresh-token revocation, tenant scoping — could skip in
          // silence while the build stayed green. A guard that only watches the
          // file it was written for is a guard that stops working the moment
          // someone adds a second one.
          const rls = (report.testResults || []).filter((f) =>
            String(f.name || '').endsWith('.postgres.test.ts')
          );
          if (rls.length === 0) {
            console.error(
              'No *.postgres.test.ts suite appeared in the run at all. ' +
              'Tenant isolation is UNVERIFIED by this build.'
            );
            process.exit(1);
          }
          console.log('Postgres suites found: ' + rls.map((f) => String(f.name).split('/').pop()).join(', '));
          let ran = 0, skipped = 0;
          for (const file of rls) {
            for (const t of file.assertionResults || []) {
              if (t.status === 'pending' || t.status === 'skipped') skipped++;
              else ran++;
            }
          }
          console.log(`Postgres enforcement suites: ${ran} ran, ${skipped} skipped`);
          if (ran === 0 || skipped > 0) {
            console.error(
              'A Postgres enforcement suite did not fully run. Tenant isolation ' +
              'is UNVERIFIED by this build.'
            );
            process.exit(1);
          }
          JS

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test-frontend, test-backend]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Mirrors the Vercel build command (vercel.json:
      # "buildCommand": "npm run build:shared && npm run build:frontend").
      # `npm run build` runs both, plus a documented no-op backend step
      # (server-handlers ship via @vercel/node/esbuild, no compile step).
      - name: Build all packages
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: build
          path: |
            dist/
            packages/*/dist/
          retention-days: 7
