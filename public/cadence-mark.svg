<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" role="img" aria-label="Cadence">
  <title>Cadence</title>
  <!--
    The caret-on-timeline logomark, lifted from the in-app mark (CadenceTile in
    src/pages/Welcome.tsx and the wordmark in src/components/auth/AuthLayout.tsx)
    and from logos/cadence.svg with the wordmark text dropped. Same geometry,
    same single emerald accent.

    The tile is always dark and opaque, so the icon carries its own background
    and reads identically in light and dark browser chrome — no
    prefers-color-scheme variant needed. `rgba()` in the original is written
    here as stroke + stroke-opacity so non-browser rasterisers (rsvg,
    ImageMagick) render the hairline too.
  -->
  <rect x="0.75" y="0.75" width="46.5" height="46.5" rx="12" fill="#0A0A0B" stroke="#808080" stroke-opacity="0.35" stroke-width="1"/>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- timeline -->
    <path d="M10,33 H38" stroke="#F7F8F8" stroke-opacity="0.82" stroke-width="2"/>
    <!-- faint beats -->
    <path d="M15,30.5 V33" stroke="#F7F8F8" stroke-opacity="0.28" stroke-width="1.5"/>
    <path d="M22,30.5 V33" stroke="#F7F8F8" stroke-opacity="0.28" stroke-width="1.5"/>
    <path d="M36,30.5 V33" stroke="#F7F8F8" stroke-opacity="0.28" stroke-width="1.5"/>
    <!-- the downbeat: a caret that lands on the timeline -->
    <path d="M25.6,15.2 L29,18.6 L32.4,15.2" stroke="#34D399" stroke-width="2.4"/>
    <path d="M29,18.6 V33" stroke="#34D399" stroke-width="2.4"/>
  </g>
</svg>
