name: Keep-alive + uptime probe

# Supabase's free tier auto-pauses a project after 7 days without activity.
# That is not hypothetical here: on 2026-07-30 it paused the project backing
# LifeQuest, whose API then returned 500 on every route for 38 minutes while
# the frontend kept serving 200s, and nothing reported it. During a beta that
# failure mode is fatal and invisible.
#
# This prevents it without paying for Supabase Pro, and doubles as the uptime
# monitor, because a failed scheduled run emails the repository owner.
#
# ## The probe must actually reach Postgres
#
# That is the whole difficulty, and there are three ways to get it wrong:
#
#   - Supabase's REST gateway answers BEFORE Postgres finishes recovering, so
#     hitting `<ref>.supabase.co/rest/v1/` proves nothing.
#   - Cadence's health endpoint USED to be a static JSON literal that never
#     queried the database. A cron pointed at that kept nothing warm while
#     looking perfectly green. It now runs `SELECT 1` and reports the result.
#   - An earlier version of this workflow probed `POST /auth/login`, because
#     it runs a real user lookup. That worked, but the auth rate limiter
#     answers 429 BEFORE the query — so under any burst the probe stopped
#     reaching Postgres and started raising false alarms. Verified by tripping
#     it: the run failed with RATE_LIMIT_EXCEEDED.
#
# Both apps now expose an unauthenticated, un-rate-limited health route that
# genuinely queries Postgres — Cadence via `SELECT 1` reported as
# `checks.database.ok`, LifeQuest via `prisma.$queryRaw SELECT 1`. Those are
# the correct probes: no credentials, no rate-limit interaction, and an
# explicit database result rather than an inference.
#
# ## The assertion is the point
#
# A 200 alone is not enough — Cadence returns 503 with `ok: false` when the
# database is unreachable, which is exactly the case worth alerting on. So the
# check requires the database field itself to be true.
#
# ## Known limitation
#
# GitHub disables scheduled workflows after 60 days of repository inactivity.
# An active beta means regular pushes, but if this repo goes quiet, re-enable
# the schedule from the Actions tab.

on:
  schedule:
    # Every 6 hours — a wide margin under the 7-day idle threshold, so several
    # consecutive missed runs (GitHub delays cron under load) still cannot let
    # a project reach the pause window.
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keepalive
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe every free-tier database through a real query
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import sys
          import urllib.error
          import urllib.request

          TIMEOUT = 30

          def fetch(url):
              req = urllib.request.Request(url, headers={"User-Agent": "cadence-keepalive"})
              try:
                  with urllib.request.urlopen(req, timeout=TIMEOUT) as r:
                      return r.status, r.read().decode("utf-8", "replace")
              except urllib.error.HTTPError as e:
                  # 503 from Cadence's health route means "database down" and is
                  # a real answer worth reading, not a transport failure.
                  return e.code, e.read().decode("utf-8", "replace")
              except Exception as exc:
                  return None, f"{type(exc).__name__}: {exc}"

          def check_cadence(body):
              """Cadence wraps its payload and reports the SELECT 1 explicitly."""
              data = json.loads(body).get("data", {})
              db = data.get("checks", {}).get("database", {})
              if db.get("ok") is not True:
                  return f"database not ok: {db}"
              return None

          def check_lifequest(body):
              """LifeQuest's health route only returns ok if its SELECT 1 succeeded."""
              if json.loads(body).get("status") != "ok":
                  return f"status not ok: {body[:200]}"
              return None

          TARGETS = [
              ("Cadence",   "https://usecadenceapp.vercel.app/api/health", check_cadence),
              ("LifeQuest", "https://getlifequest.vercel.app/api/health",  check_lifequest),
          ]

          failed = False
          # Probe every target before exiting, so one dead app cannot mask another.
          for name, url, check in TARGETS:
              status, body = fetch(url)
              if status != 200:
                  print(f"::error title={name} unhealthy::expected 200, got {status}. Body: {body[:300]}")
                  failed = True
                  continue
              try:
                  problem = check(body)
              except (ValueError, AttributeError) as exc:
                  problem = f"unparseable response ({exc}): {body[:200]}"
              if problem:
                  print(f"::error title={name} did not reach Postgres::{problem}")
                  failed = True
                  continue
              print(f"{name} OK — health route queried Postgres successfully.")

          sys.exit(1 if failed else 0)
          PY
